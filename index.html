<!DOCTYPE html>
<html>
<head>
<title>FashionAndDesign</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Georgia, serif;
background:#f8f6f1;
color:#111;
}

header{
height:90vh;
background:linear-gradient(90deg,#000000cc,#00000033),
url("https://images.unsplash.com/photo-1445205170230-053b83016050");
background-size:cover;
background-position:center;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

header h1{
font-size:80px;
letter-spacing:8px;
margin:0;
}

header p{
font-size:28px;
}

.btn{
background:#c9a227;
color:white;
padding:18px 45px;
border-radius:40px;
font-size:20px;
text-decoration:none;
}

.section{
padding:70px 5%;
text-align:center;
}

.section h2{
font-size:50px;
}

.products{
display:flex;
gap:40px;
justify-content:center;
flex-wrap:wrap;
}

.card{
background:white;
width:350px;
height:430px;
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 30px #ccc;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card h3{
font-size:30px;
}

.card button{
background:#111;
color:white;
padding:15px 35px;
border:0;
border-radius:30px;
font-size:18px;
}

footer{
background:#111;
color:white;
padding:30px;
text-align:center;
font-size:18px;
}

</style>
</head>

<body>

<header>

<h1>FashionAndDesign</h1>

<p>Creează stilul tău. Poartă ceva unic.</p>

<a class="btn">Începe designul</a>

</header>


<div class="section">

<h2>Colecțiile noastre</h2>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
<h3>Haine</h3>
<button>Personalizează</button>
</div>


<div class="card">
<img src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338">
<h3>Bijuterii</h3>
<button>Personalizează</button>
</div>


<div class="card">
<img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa">
<h3>Accesorii</h3>
<button>Personalizează</button>
</div>

</div>

</div>


<footer>
© 2026 FashionAndDesign
</footer>

</body>
</html>
