<!DOCTYPE html>
<html>
<head>
<title>FashionAndDesign</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #faf7f2;
    color: #222;
}

header {
    background: white;
    padding: 30px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

h1 {
    font-size: 45px;
    letter-spacing: 3px;
}

.subtitlu {
    color: #777;
}

.container {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    padding: 40px;
}

.card {
    background: white;
    width: 280px;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 5px 20px #ddd;
}

.card h2 {
    font-size: 25px;
}

button {
    background: #111;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 30px;
    cursor: pointer;
}

button:hover {
    background: #555;
}

footer {
    text-align:center;
    padding:30px;
    color:#777;
}
</style>

</head>

<body>

<header>
<h1>FashionAndDesign</h1>
<p class="subtitlu">
Creează produse unice, exact cum îți dorești.
</p>
</header>


<div class="container">

<div class="card">
<h2>👕 Haine</h2>
<p>Tricouri, hanorace și articole create de tine.</p>
<button>Personalizează</button>
</div>


<div class="card">
<h2>💎 Bijuterii</h2>
<p>Modele elegante create după stilul tău.</p>
<button>Personalizează</button>
</div>


<div class="card">
<h2>👜 Accesorii</h2>
<p>Genți, huse și obiecte speciale.</p>
<button>Personalizează</button>
</div>

</div>


<footer>
© 2026 FashionAndDesign
</footer>

</body>
</html>
